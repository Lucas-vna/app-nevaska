<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nevaska - Monitoramento de Freezers</title>

  <!-- PWA: manifest e ícones REAIS (manifest em data: URL não funciona bem para instalar no iPhone) -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00A3E0">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nevaska">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root { --azul-nevaska: #00A3E0; --amarelo-nevaska: #FFD100; --vermelho-alerta: #E30613; --verde-ok: #28a745; --cinza-off: #8a94a0; --fundo-gelo: #EBF6FC; --texto-escuro: #1A2B3C; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--fundo-gelo); color: var(--texto-escuro); padding-bottom: 30px; }
    header { background: linear-gradient(135deg, var(--azul-nevaska), #0077A8); color: white; padding: 20px; padding-top: max(20px, env(safe-area-inset-top)); text-align: center; border-bottom: 4px solid var(--amarelo-nevaska); }
    .header-pills { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .pill { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; background-color: rgba(255, 255, 255, 0.2); }
    .pill.ruim { background-color: rgba(227, 6, 19, 0.85); }
    #pill-alertas { display: none; }
    .notif-banner { background-color: var(--amarelo-nevaska); color: #333; text-align: center; padding: 12px 16px; font-weight: bold; display: none; align-items: center; justify-content: center; gap: 8px; line-height: 1.4; }
    .notif-banner.clicavel { cursor: pointer; }
    .notif-banner.erro { background-color: #FCE8E6; color: var(--vermelho-alerta); }
    .notif-banner small { display: block; font-weight: normal; font-size: 0.85rem; }
    .store-tabs { display: flex; justify-content: center; gap: 10px; margin: 20px auto; max-width: 500px; padding: 0 15px; }
    .tab-btn { flex: 1; padding: 12px 15px; border: 2px solid var(--azul-nevaska); background-color: white; color: var(--azul-nevaska); font-weight: bold; border-radius: 12px; cursor: pointer; position: relative; }
    .tab-btn.active { background-color: var(--azul-nevaska); color: white; }
    .tab-btn .ponto-alerta { display: none; position: absolute; top: -5px; right: -5px; width: 14px; height: 14px; border-radius: 50%; background: var(--vermelho-alerta); border: 2px solid white; }
    .tab-btn.tem-alerta .ponto-alerta { display: block; }
    .container { max-width: 600px; margin: 0 auto; padding: 0 15px; }
    .store-section { display: none; }
    .store-section.active { display: block; }
    .vazio { text-align: center; color: #777; padding: 30px 10px; font-size: 0.9rem; }
    .freezer-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px; border-left: 6px solid #ccc; }
    .freezer-card.ok { border-left-color: var(--verde-ok); }
    .freezer-card.alert { border-left-color: var(--vermelho-alerta); background-color: #FFF5F5; }
    .freezer-card.off { border-left-color: var(--cinza-off); background-color: #F4F5F7; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .card-title { font-size: 1.2rem; font-weight: bold; }
    .status-badge { font-size: 0.75rem; font-weight: bold; padding: 4px 8px; border-radius: 8px; text-transform: uppercase; }
    .status-badge.online { background-color: #E6F4EA; color: var(--verde-ok); }
    .status-badge.offline { background-color: #FCE8E6; color: var(--vermelho-alerta); }
    .card-body { display: flex; align-items: center; justify-content: space-between; }
    .temp-display { font-size: 2.5rem; font-weight: 800; }
    .temp-display.ok { color: var(--verde-ok); }
    .temp-display.alert { color: var(--vermelho-alerta); }
    .temp-display.off { color: var(--cinza-off); }
    .temp-limite { font-size: 0.75rem; color: #777; margin-top: 2px; }
    .temp-icon { font-size: 2.2rem; color: var(--azul-nevaska); }
    .card-footer { margin-top: 10px; font-size: 0.75rem; color: #777; text-align: right; }
  </style>
</head>
<body>
  <header>
    <h1>NEVASKA</h1>
    <p>Monitoramento de Freezers</p>
    <div class="header-pills">
      <span id="connection-status" class="pill">Carregando...</span>
      <span id="pill-alertas" class="pill"><i class="fa-solid fa-bell"></i> Alertas ativos</span>
    </div>
  </header>

  <!-- Banner muda de texto conforme a situação do celular (ver iniciarNotificacoes) -->
  <div id="notif-btn" class="notif-banner"></div>

  <!-- Abas e seções são montadas a partir das lojas configuradas na Vercel -->
  <div class="store-tabs" id="abas"></div>
  <div class="container" id="secoes"></div>

  <script>
    // =========================================================================
    // ARQUITETURA (resumo)
    // - O ESP32 envia a temperatura para a Vercel (/api/telemetria) por HTTPS.
    // - Este painel só LÊ o estado guardado no servidor (/api/estado).
    //   Não há mais MQTT nem senha de broker no navegador.
    // - Os ALERTAS não dependem do painel aberto: quem dispara é o servidor,
    //   via Web Push + Telegram, com o celular bloqueado.
    // =========================================================================

    const INTERVALO_ATUALIZACAO_MS = 20000; // o ESP32 envia a cada 60 s

    // Valores padrão; substituídos pelos do servidor em /api/config.
    let CFG = { vapidPublicKey: null, offlineMin: 3, nomesLojas: { NEVASKA_SC: 'Santa Cruz', NEVASKA_BERNARDINO: 'Bernardino' }, painelProtegido: false };
    let swRegistration = null;

    async function carregarConfig() {
      try {
        const r = await fetch('/api/config', { cache: 'no-store' });
        if (r.ok) CFG = { ...CFG, ...(await r.json()) };
      } catch (e) { console.warn('Sem /api/config, usando padrões', e); }
    }

    // =========================================================================
    // 1) NOTIFICAÇÕES PUSH (Web Push com VAPID)
    // =========================================================================
    const ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const ehStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    const suportaPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

    function mostrarBanner(html, { clique = null, erro = false } = {}) {
      const el = document.getElementById('notif-btn');
      el.innerHTML = html;
      el.style.display = 'flex';
      el.classList.toggle('clicavel', !!clique);
      el.classList.toggle('erro', erro);
      el.onclick = clique;
    }
    function esconderBanner() {
      document.getElementById('notif-btn').style.display = 'none';
    }
    function marcarAlertasAtivos(ativo) {
      document.getElementById('pill-alertas').style.display = ativo ? 'inline-block' : 'none';
    }

    function base64UrlParaUint8(base64Url) {
      const padding = '='.repeat((4 - (base64Url.length % 4)) % 4);
      const base64 = (base64Url + padding).replace(/-/g, '+').replace(/_/g, '/');
      const bruto = atob(base64);
      return Uint8Array.from([...bruto].map(c => c.charCodeAt(0)));
    }

    async function enviarInscricaoAoServidor(inscricao, confirmar) {
      const r = await fetch('/api/inscrever', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subscription: inscricao.toJSON(), confirmar })
      });
      if (!r.ok) throw new Error('Servidor recusou a inscrição (' + r.status + ')');
    }

    async function iniciarNotificacoes() {
      // iPhone: push só existe com o app ABERTO PELO ÍCONE da Tela de Início (iOS 16.4+).
      if (ehIOS && !ehStandalone) {
        mostrarBanner(`<i class="fa-solid fa-mobile-screen"></i><span>Para receber alertas no iPhone:<small>toque em <i class="fa-solid fa-arrow-up-from-bracket"></i> Compartilhar → <b>Adicionar à Tela de Início</b> e abra o Nevaska pelo ícone.</small></span>`);
        return;
      }
      if (!suportaPush) {
        mostrarBanner(`<i class="fa-solid fa-triangle-exclamation"></i><span>Este navegador não suporta notificações push.<small>No Android use o Chrome; no iPhone, iOS 16.4 ou mais recente.</small></span>`, { erro: true });
        return;
      }

      try {
        swRegistration = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
        await navigator.serviceWorker.ready;
      } catch (e) {
        mostrarBanner('<i class="fa-solid fa-triangle-exclamation"></i> Falha ao registrar o service worker.', { erro: true });
        console.error(e);
        return;
      }

      if (Notification.permission === 'denied') {
        mostrarBanner(`<i class="fa-solid fa-bell-slash"></i><span>Notificações bloqueadas neste celular.<small>Libere em Configurações → Notificações → Nevaska (ou nas configurações do site no Chrome) e recarregue.</small></span>`, { erro: true });
        return;
      }

      const atual = await swRegistration.pushManager.getSubscription();
      if (atual && Notification.permission === 'granted') {
        // Reenvia sempre: se o servidor perdeu a inscrição, ela se recupera sozinha.
        enviarInscricaoAoServidor(atual, false).catch(console.error);
        esconderBanner();
        marcarAlertasAtivos(true);
        return;
      }

      mostrarBanner('<i class="fa-solid fa-bell"></i> Toque aqui para ATIVAR OS ALERTAS neste celular', { clique: ativarAlertas });
    }

    async function ativarAlertas() {
      // No iOS o pedido de permissão PRECISA ser a primeira coisa do toque do usuário.
      const permissao = await Notification.requestPermission();
      if (permissao !== 'granted') {
        mostrarBanner('<i class="fa-solid fa-bell-slash"></i> Permissão negada. Os alertas não vão chegar neste celular.', { erro: true });
        return;
      }
      mostrarBanner('<i class="fa-solid fa-spinner fa-spin"></i> Ativando alertas...');
      try {
        if (!CFG.vapidPublicKey) await carregarConfig();
        if (!CFG.vapidPublicKey) throw new Error('Chave VAPID não configurada no servidor');
        const reg = swRegistration || await navigator.serviceWorker.ready;
        const inscricao = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: base64UrlParaUint8(CFG.vapidPublicKey)
        });
        await enviarInscricaoAoServidor(inscricao, true); // servidor manda push de confirmação
        esconderBanner();
        marcarAlertasAtivos(true);
      } catch (e) {
        console.error(e);
        mostrarBanner(`<i class="fa-solid fa-triangle-exclamation"></i><span>Não foi possível ativar.<small>${e.message}. Toque para tentar de novo.</small></span>`, { clique: ativarAlertas, erro: true });
      }
    }

    // =========================================================================
    // 2) SENHA OPCIONAL DO PAINEL (só se PAINEL_CHAVE estiver configurada)
    // =========================================================================
    function lerChavePainel() {
      try { return localStorage.getItem('nevaska_chave_painel') || ''; } catch { return ''; }
    }
    function salvarChavePainel(valor) {
      try { valor ? localStorage.setItem('nevaska_chave_painel', valor) : localStorage.removeItem('nevaska_chave_painel'); } catch {}
    }
    function pedirChavePainel(msg) {
      const valor = window.prompt(msg || 'Digite a senha do painel Nevaska:');
      if (valor) salvarChavePainel(valor.trim());
      return !!valor;
    }

    // =========================================================================
    // 3) PAINEL — lê /api/estado periodicamente
    // =========================================================================
    let lojaAtiva = null;
    try { lojaAtiva = localStorage.getItem('nevaska_loja_ativa'); } catch {}
    let ultimoDado = null;      // última resposta do servidor
    let recebidoEm = 0;         // Date.now() de quando a resposta chegou
    let buscando = false;
    let timer = null;

    function nomeDaLoja(loja) {
      return CFG.nomesLojas?.[loja] || loja.replace(/^NEVASKA_/, '').replace(/_/g, ' ');
    }

    function definirStatusConexao(texto, ruim) {
      const el = document.getElementById('connection-status');
      el.textContent = texto;
      el.classList.toggle('ruim', !!ruim);
    }

    function switchStore(loja) {
      lojaAtiva = loja;
      try { localStorage.setItem('nevaska_loja_ativa', loja); } catch {}
      document.querySelectorAll('.store-section').forEach(el => el.classList.toggle('active', el.dataset.loja === loja));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.toggle('active', el.dataset.loja === loja));
    }

    // Garante que existe aba + seção para cada loja (configuradas + as que aparecerem nos dados).
    function garantirLojas(lojas) {
      const abas = document.getElementById('abas');
      const secoes = document.getElementById('secoes');
      for (const loja of lojas) {
        if (document.querySelector(`.tab-btn[data-loja="${CSS.escape(loja)}"]`)) continue;

        const btn = document.createElement('button');
        btn.className = 'tab-btn';
        btn.dataset.loja = loja;
        const icone = document.createElement('i'); icone.className = 'fa-solid fa-store';
        const ponto = document.createElement('span'); ponto.className = 'ponto-alerta';
        btn.append(icone, ' ' + nomeDaLoja(loja), ponto);
        btn.onclick = () => switchStore(loja);
        abas.appendChild(btn);

        const secao = document.createElement('div');
        secao.className = 'store-section';
        secao.dataset.loja = loja;
        const vazio = document.createElement('p'); vazio.className = 'vazio'; vazio.textContent = 'Nenhum freezer enviou dados ainda.';
        secao.appendChild(vazio);
        secoes.appendChild(secao);
      }
      if (!lojaAtiva || !lojas.includes(lojaAtiva)) lojaAtiva = lojas[0];
      if (lojaAtiva) switchStore(lojaAtiva);
    }

    // Cria o card com createElement/textContent (nada de innerHTML com dados externos).
    function criarCard(f, secao) {
      secao.querySelector('.vazio')?.remove();
      const card = document.createElement('div');
      card.className = 'freezer-card ok';
      card.dataset.id = f.id;
      card.innerHTML = `
        <div class="card-header"><span class="card-title"></span><span class="status-badge online"></span></div>
        <div class="card-body"><div><div class="temp-display ok">-- °C</div><div class="temp-limite"></div></div><i class="fa-solid fa-snowflake temp-icon"></i></div>
        <div class="card-footer"></div>`;
      card.querySelector('.card-title').textContent = f.freezer.replace(/_/g, ' ').toUpperCase();
      secao.appendChild(card);
      return card;
    }

    function textoTempo(segundos) {
      if (segundos === null || segundos === undefined) return 'sem leituras';
      if (segundos < 60) return `há ${segundos} s`;
      const min = Math.floor(segundos / 60);
      if (min < 60) return `há ${min} min`;
      const h = Math.floor(min / 60);
      return `há ${h}h${String(min % 60).padStart(2, '0')}`;
    }

    function renderizar() {
      if (!ultimoDado) return;
      const decorrido = Math.round((Date.now() - recebidoEm) / 1000);
      const lojasComAlerta = new Set();

      for (const f of ultimoDado.freezers) {
        const secao = document.querySelector(`.store-section[data-loja="${CSS.escape(f.loja)}"]`);
        if (!secao) continue;
        const card = secao.querySelector(`.freezer-card[data-id="${CSS.escape(f.id)}"]`) || criarCard(f, secao);
        const tempEl = card.querySelector('.temp-display');
        const badge = card.querySelector('.status-badge');
        const segundos = f.segundosSemDados === null ? null : f.segundosSemDados + decorrido;
        const offline = f.offline || (segundos !== null && segundos > ultimoDado.offlineMin * 60);

        card.querySelector('.temp-limite').textContent = `Alerta acima de ${Number(f.limite).toFixed(1)} °C`;
        card.querySelector('.card-footer').textContent = offline
          ? `Sem sinal ${textoTempo(segundos)}`
          : `Última leitura ${textoTempo(segundos)}`;
        tempEl.textContent = f.temp === null ? '-- °C' : `${Number(f.temp).toFixed(1)} °C`;

        if (offline) {
          card.className = 'freezer-card off';
          tempEl.className = 'temp-display off';
          badge.className = 'status-badge offline';
          badge.textContent = 'OFFLINE';
          lojasComAlerta.add(f.loja);
        } else if (f.sensorFalha) {
          card.className = 'freezer-card alert';
          tempEl.className = 'temp-display alert';
          tempEl.textContent = 'ERRO';
          badge.className = 'status-badge offline';
          badge.textContent = 'SENSOR';
          lojasComAlerta.add(f.loja);
        } else if (f.temp !== null && f.temp > f.limite) {
          card.className = 'freezer-card alert';
          tempEl.className = 'temp-display alert';
          badge.className = 'status-badge offline';
          badge.textContent = f.tempAlerta ? 'ALERTA' : 'ACIMA';
          lojasComAlerta.add(f.loja);
        } else {
          card.className = 'freezer-card ok';
          tempEl.className = 'temp-display ok';
          badge.className = 'status-badge online';
          badge.textContent = 'ONLINE';
        }
      }

      // Bolinha vermelha na aba da loja que tem problema (útil quando você está olhando a outra).
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('tem-alerta', lojasComAlerta.has(btn.dataset.loja)));
    }

    async function atualizar() {
      if (buscando) return;
      buscando = true;
      try {
        const headers = {};
        const chave = lerChavePainel();
        if (chave) headers['x-chave-painel'] = chave;

        const r = await fetch('/api/estado', { headers, cache: 'no-store' });
        if (r.status === 401) {
          salvarChavePainel('');
          definirStatusConexao('● Senha do painel necessária', true);
          if (pedirChavePainel(chave ? 'Senha incorreta. Digite a senha do painel:' : undefined)) {
            buscando = false;
            return atualizar();
          }
          return;
        }
        if (!r.ok) throw new Error('HTTP ' + r.status);

        ultimoDado = await r.json();
        recebidoEm = Date.now();
        const lojas = [...new Set([...Object.keys(CFG.nomesLojas || {}), ...ultimoDado.freezers.map(f => f.loja)])];
        garantirLojas(lojas);
        renderizar();
        definirStatusConexao('● Sistema Online · ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
      } catch (e) {
        console.error(e);
        definirStatusConexao('● Sem conexão com o servidor', true);
      } finally {
        buscando = false;
      }
    }

    function iniciarAtualizacao() {
      clearInterval(timer);
      atualizar();
      timer = setInterval(atualizar, INTERVALO_ATUALIZACAO_MS);
    }

    // Só consulta o servidor com o painel visível; ao voltar para o app, atualiza na hora.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') iniciarAtualizacao();
      else clearInterval(timer);
    });

    // Atualiza o "há X s" dos cards entre uma consulta e outra.
    setInterval(renderizar, 5000);

    // =========================================================================
    // Início
    // =========================================================================
    carregarConfig().then(() => {
      garantirLojas(Object.keys(CFG.nomesLojas || {}));
      iniciarAtualizacao();
      iniciarNotificacoes();
    });
  </script>
</body>
</html>
